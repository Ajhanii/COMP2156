name: CI

on:
  push:
    branches:[ "main" ]
pull_request:
  brnches [ "main" ]
job:
  build:
    runs-on: ubuntu-lastest

 steps:
    -name: Checkout code
    uses: action/checkout@v4

  -name: Set up node.js
  uses: action/setup-node@v4
  with:
    node-version: '20'

  - name: Install dependencies
run: npm install

 - name: Run tests
run: npm test

